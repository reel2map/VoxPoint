name: ui_kit
description: "UI-Kit"
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.7.2 <4.0.0"
  flutter: ">=3.22.3"

dependencies:
  cached_network_image: ^3.4.1
  dependencies:
    path: ../../shared/dependencies
  flag: ^7.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  release_to_trigger: ^1.0.2
  shimmer: ^3.0.0
  swipe_refresh: ^1.0.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_gen: ^5.8.0
  flutter_gen_runner: ^5.8.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter_gen:
  output: lib/src/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Commissioner
      fonts:
        - asset: fonts/commissioner/Commissioner-Thin.ttf
          weight: 100
        - asset: fonts/commissioner/Commissioner-ExtraLight.ttf
          weight: 200
        - asset: fonts/commissioner/Commissioner-Light.ttf
          weight: 300
        - asset: fonts/commissioner/Commissioner-Regular.ttf
          weight: 400
        - asset: fonts/commissioner/Commissioner-Medium.ttf
          weight: 500
        - asset: fonts/commissioner/Commissioner-SemiBold.ttf
          weight: 600
        - asset: fonts/commissioner/Commissioner-Bold.ttf
          weight: 700
        - asset: fonts/commissioner/Commissioner-ExtraBold.ttf
          weight: 800
        - asset: fonts/commissioner/Commissioner-Black.ttf
          weight: 900
